services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: powerdns
      POSTGRES_USER: powerdns
      POSTGRES_PASSWORD: ${DNS_DB_PASSWORD:?DNS_DB_PASSWORD is required}
    volumes:
      - primary_database:/var/lib/postgresql/data
      - ./powerdns-schema.sql:/docker-entrypoint-initdb.d/10-powerdns.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerdns -d powerdns"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [dns_private]

  authoritative:
    image: powerdns/pdns-auth-50:5.0.7
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    command:
      - --launch=gpgsql
      - --gpgsql-host=database
      - --gpgsql-dbname=powerdns
      - --gpgsql-user=powerdns
      - --gpgsql-password=${DNS_DB_PASSWORD:?DNS_DB_PASSWORD is required}
      - --primary=yes
      - --secondary=no
      - --api=yes
      - --api-key=${DNS_API_KEY:?DNS_API_KEY is required}
      - --webserver=yes
      - --webserver-address=0.0.0.0
      - --webserver-port=8081
      - --webserver-allow-from=${BACKEND_PRIVATE_CIDR:?BACKEND_PRIVATE_CIDR is required},127.0.0.1/32
      - --allow-axfr-ips=${SECONDARY_PUBLIC_IP:?SECONDARY_PUBLIC_IP is required}/32
      - --also-notify=${SECONDARY_PUBLIC_IP:?SECONDARY_PUBLIC_IP is required}
      - --default-ttl=300
      - --loglevel=4
    ports:
      - ${DNS_LISTEN_ADDRESS:-0.0.0.0}:53:53/udp
      - ${DNS_LISTEN_ADDRESS:-0.0.0.0}:53:53/tcp
      - ${DNS_API_BIND_ADDRESS:-127.0.0.1}:8081:8081/tcp
    healthcheck:
      test: ["CMD", "pdns_control", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [dns_private]

volumes:
  primary_database:

networks:
  dns_private:
    driver: bridge
