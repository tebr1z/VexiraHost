name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://vexira:vexira@localhost:5432/vexira_host
  REDIS_URL: redis://localhost:6379
  REDIS_ENABLED: "true"
  JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
  HOSTING_CREDENTIALS_KEY: ci-hosting-credentials-key-32chars
  DEPLOY_MOCK_REMOTE: "true"
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

jobs:
  quality:
    name: Quality, unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vexira
          POSTGRES_PASSWORD: vexira
          POSTGRES_DB: vexira_host
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vexira -d vexira_host"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexira/backend prisma:generate
      - run: pnpm --filter @vexira/backend exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @vexira/backend exec jest --config ./test/jest-e2e.json --runInBand
      - run: pnpm build

  browser-e2e:
    name: Browser E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          if [ "${{ matrix.project }}" = "mobile-chrome" ]; then
            pnpm --filter @vexira/frontend exec playwright install --with-deps chromium
          else
            pnpm --filter @vexira/frontend exec playwright install --with-deps "${{ matrix.project }}"
          fi
      - name: Build frontend workspace dependencies
        run: pnpm --filter "@vexira/frontend^..." build
      - run: pnpm --filter @vexira/frontend build
      - run: pnpm --filter @vexira/frontend exec playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results

  backup-restore:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vexira
          POSTGRES_PASSWORD: vexira
          POSTGRES_DB: vexira_host
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vexira -d vexira_host"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexira/backend exec prisma migrate deploy
      - id: backup
        run: echo "path=$(DATABASE_URL="$DATABASE_URL" ./scripts/backup-postgres.sh "$RUNNER_TEMP/backups")" >> "$GITHUB_OUTPUT"
      - name: Create restore database
        env:
          PGPASSWORD: vexira
        run: createdb --host=localhost --username=vexira vexira_restore_ci
      - run: RESTORE_DATABASE_URL="postgresql://vexira:vexira@localhost:5432/vexira_restore_ci" ./scripts/verify-postgres-restore.sh "${{ steps.backup.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-postgres-backup
          path: |
            ${{ steps.backup.outputs.path }}
            ${{ steps.backup.outputs.path }}.sha256
          retention-days: 3
